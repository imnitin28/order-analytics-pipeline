kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: order-analytics

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Expose Streamlit dashboard and Kibana (later) without extra port-forward juggling
      - containerPort: 30080
        hostPort: 8501
        protocol: TCP
      - containerPort: 30081
        hostPort: 5601
        protocol: TCP
  - role: worker
  - role: worker

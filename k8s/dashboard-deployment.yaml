apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: app
  labels:
    app: dashboard
    tier: pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
        tier: pipeline
    spec:
      containers:
        - name: dashboard
          image: order-analytics-dashboard:local   # kind load docker-image order-analytics-dashboard:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef:
                name: pipeline-config
            - secretRef:
                name: postgres-credentials
          resources:
            requests:
              memory: 192Mi
              cpu: 100m
            limits:
              memory: 384Mi
              cpu: 250m
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10

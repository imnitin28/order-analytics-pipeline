# NOTE: for a local kind demo, base64'd plaintext is fine.
# For anything beyond local learning, use a real secrets manager instead.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: app
type: Opaque
stringData:
  POSTGRES_DB: orders_db
  POSTGRES_USER: orders_app
  POSTGRES_PASSWORD: change-me-locally
